---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "reana.prefix" . }}-deployment-manager
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["nodes", "nodes/status", "pods", "pods/log", "persistentvolumeclaims", "configmaps"]
  verbs: ["get", "list", "create", "update", "watch"]
- apiGroups: [""] # "" indicates the core API group
  # Interactive-session Secrets (the per-session notebook token) are created
  # and, on a failed/aborted session launch, cleaned up by
  # delete_k8s_objects_if_exist -> delete_namespaced_secret. A separate rule
  # (rather than adding "delete" to the broader resource list above) keeps
  # that verb scoped to secrets, not also nodes/pods/configmaps/pvcs.
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "watch", "delete"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["*"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Interactive web notebooks permissions
- apiGroups: ["", "apps", "networking.k8s.io"]
  resources: ["deployments", "services", "ingresses"]
  verbs: ["get", "create", "delete"]
# NetworkPolicy for the sandboxed workflow specification validator. The
# controller creates the deny-egress policy and, on conflict, reads its
# resourceVersion before replacing it.
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "get", "update"]
# Metrics (`kubectl top node/pod`)
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
# Custom dask kubernetes resources
{{- if .Values.dask.enabled }}
- apiGroups: ["kubernetes.dask.org"]
  resources: ["daskclusters", "daskautoscalers"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
{{- end }}
# Traefik Middleware permissions
{{- if and .Values.dask.enabled (or .Values.traefik.enabled .Values.traefik.external) }}
- apiGroups: ["traefik.io"]
  resources: ["middlewares"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "reana.prefix" . }}-manage-deployments
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "reana.prefix" . }}-deployment-manager
subjects:
- kind: ServiceAccount
  name: {{ include "reana.prefixed_infrastructure_svaccount_name" . }}
  namespace: {{ .Release.Namespace }}
---
# Minimal RBAC for the runtime ServiceAccount. Its projected credential is
# mounted only into the trusted job-controller sidecar; the workflow-engine
# container that executes user-submitted code has ServiceAccount automounting
# disabled and does not receive this credential. It must never carry the same
# privileges as the infrastructure ServiceAccount that
# reana-workflow-controller itself runs as (PR976-17) -- audited against
# reana-job-controller's actual Kubernetes API usage
# (kubernetes_job_manager.py, job_monitor.py): it only creates/deletes
# Jobs, lists/watches Pods and reads Pod logs, and does a single
# read-only fetch of the user's own secrets-store Secret. No list/create/
# update/delete on secrets, no configmaps/pvc access, no deployment/
# service/ingress or storageclass management.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "reana.prefix" . }}-runtime-worker
  namespace: {{ .Values.namespace_runtime | default .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "reana.prefix" . }}-runtime-worker
  namespace: {{ .Values.namespace_runtime | default .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "reana.prefix" . }}-runtime-worker
subjects:
- kind: ServiceAccount
  name: {{ include "reana.prefixed_runtime_svaccount_name" . }}
  namespace: {{ .Values.namespace_runtime | default .Release.Namespace }}
