{{- if or .Values.keycloak.enabled (and .Values.auth.issuer .Values.auth.bffEnabled) .Values.auth.cernGroupBackend.enabled .Values.auth.indigoIamGroupBackend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reana.prefix" . }}-auth-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if or .Values.keycloak.enabled .Values.auth.bffEnabled (and .Values.auth.cernGroupBackend.enabled (eq (.Values.auth.cernGroupBackend.clientSecretEnv | default "REANA_GROUP_BACKEND_CERN_CLIENT_SECRET") "REANA_AUTH_WEB_CLIENT_SECRET")) }}
  REANA_AUTH_WEB_CLIENT_SECRET: {{ required "secrets.auth.REANA_AUTH_WEB_CLIENT_SECRET must be set when BFF authentication or bundled development Keycloak is enabled." .Values.secrets.auth.REANA_AUTH_WEB_CLIENT_SECRET | b64enc | quote }}
  {{- end }}
  {{- if and .Values.auth.cernGroupBackend.enabled (ne (.Values.auth.cernGroupBackend.clientSecretEnv | default "REANA_GROUP_BACKEND_CERN_CLIENT_SECRET") "REANA_AUTH_WEB_CLIENT_SECRET") }}
  {{ .Values.auth.cernGroupBackend.clientSecretEnv | default "REANA_GROUP_BACKEND_CERN_CLIENT_SECRET" }}: {{ required "secrets.auth.REANA_GROUP_BACKEND_CERN_CLIENT_SECRET must be set when auth.cernGroupBackend.enabled=true." .Values.secrets.auth.REANA_GROUP_BACKEND_CERN_CLIENT_SECRET | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.indigoIamGroupBackend.enabled }}
  {{ .Values.auth.indigoIamGroupBackend.clientSecretEnv | default "REANA_GROUP_BACKEND_INDIGO_IAM_CLIENT_SECRET" }}: {{ required "secrets.auth.REANA_GROUP_BACKEND_INDIGO_IAM_CLIENT_SECRET must be set when auth.indigoIamGroupBackend.enabled=true." .Values.secrets.auth.REANA_GROUP_BACKEND_INDIGO_IAM_CLIENT_SECRET | b64enc | quote }}
  {{- end }}
{{- end }}
