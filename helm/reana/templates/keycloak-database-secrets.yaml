{{- if and .Values.keycloak.enabled (ne .Values.keycloak.database.mode "ephemeral") (not .Values.keycloak.database.existing_secret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reana.prefix" . }}-keycloak-database
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.keycloak.database.password_key | quote }}: {{ required "secrets.keycloak.database_password must be set when persistent bundled Keycloak storage is enabled and keycloak.database.existing_secret is empty" .Values.secrets.keycloak.database_password | b64enc }}
{{- end }}
