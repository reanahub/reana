{{- if .Values.debug.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "reana.prefix" . }}-mail
  namespace: {{ .Release.Namespace }}
spec:
  type: "NodePort"
  ports:
  - port: 30025
    targetPort: 1025
    nodePort: 30025
    name: "smtp"
    protocol: TCP
  - port: 32580
    targetPort: 1080
    nodePort: 32580
    name: "ui"
    protocol: TCP
  selector:
    app: {{ include "reana.prefix" . }}-mail
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reana.prefix" . }}-mail
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ if .Values.maintenance.enabled -}} 0 {{- else -}} 1 {{- end }}
  selector:
    matchLabels:
      app: {{ include "reana.prefix" . }}-mail
  template:
    metadata:
      labels:
        app: {{ include "reana.prefix" . }}-mail
    spec:
      containers:
      - name: maildev
        image: docker.io/maildev/maildev:2.2.1
        imagePullPolicy: IfNotPresent
        env:
        # MailDev 2.x runs as non-root and cannot bind to 25/80.
        - name: MAILDEV_SMTP_PORT
          value: "1025"
        - name: MAILDEV_WEB_PORT
          value: "1080"
        ports:
        - containerPort: 1080
        - containerPort: 1025
      {{- if .Values.node_label_infrastructure }}
      {{- $full_label := split "=" .Values.node_label_infrastructure }}
      nodeSelector:
        {{ $full_label._0 }}: {{ $full_label._1 }}
      {{- end }}
{{- end }}
