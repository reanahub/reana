---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reana.prefixed_infrastructure_svaccount_name" . }}
{{- if and .Values.namespace_runtime (ne .Values.namespace_runtime .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace_runtime }}
  labels:
    app.kubernetes.io/component: runtime
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/part-of: "reana"
{{- end }}
---
# Always created, even in single-namespace deployments (PR976-17): the batch
# pod that runs the user's own workflow/job code must never fall back to the
# infrastructure ServiceAccount just because no dedicated runtime namespace
# was configured -- see roles.yaml's runtime-worker Role for what this
# identity is actually scoped to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reana.prefixed_runtime_svaccount_name" . }}
  namespace: {{ .Values.namespace_runtime | default .Release.Namespace }}
