---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reana.prefixed_infrastructure_svaccount_name" . }}
{{- if and .Values.namespace_runtime (ne .Values.namespace_runtime .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace_runtime }}
  labels:
    app.kubernetes.io/component: runtime
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/part-of: "reana"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reana.prefixed_runtime_svaccount_name" . }}
  namespace: {{ .Values.namespace_runtime }}
{{- end }}
