apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs
provisioner: __ROOK_NAMESPACE__.cephfs.csi.ceph.com
parameters:
  clusterID: __ROOK_NAMESPACE__
  fsName: reanafs
  pool: reanafs-replicated
  mounter: fuse
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: __ROOK_NAMESPACE__
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: __ROOK_NAMESPACE__
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: __ROOK_NAMESPACE__
reclaimPolicy: Delete
allowVolumeExpansion: true
