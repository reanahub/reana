apiVersion: v1
kind: Pod
metadata:
  name: rook-cephfs-smoke
  namespace: __SMOKE_NAMESPACE__
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: docker.io/library/busybox:1.36
      command:
        - sh
        - -c
        - sleep 600
      volumeMounts:
        - name: reanafs
          mountPath: /mnt/reanafs
  volumes:
    - name: reanafs
      persistentVolumeClaim:
        claimName: rook-cephfs-smoke
